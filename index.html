<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DanMyers.net</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #000;
        min-height: 100vh;
        font-family: sans-serif;
        color: #fff;
      }

      /* Stars */
      #stars-container {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .star {
        position: absolute;
        border-radius: 50%;
        background: #fff;
      }

      /* Content */
      #content {
        position: relative;
        z-index: 10;
      }

      /* Hero section */
      #hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 5rem;
      }

      #hero-img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 5px solid #fff;
        object-fit: cover;
        object-position: center -50%;
        background-color: #fff;
        display: block;
      }

      @media (max-height: 620px) {
        #hero-img {
          display: none;
        }
      }

      #hero-name {
        margin-top: 1.25rem;
        font-size: 1.5rem;
        font-weight: 700;
        background: #000;
        color: #fff;
      }

      #hero-title {
        margin-top: 0.5rem;
        background: #000;
        color: #fff;
      }

      /* Social icons */
      #social {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-top: 1.25rem;
      }

      #social a {
        color: #d1d5db;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: color 0.2s;
      }

      #social a:hover {
        color: #fff;
      }

      #social svg {
        width: 2rem;
        height: 2rem;
      }

      /* Divider */
      .divider {
        width: 80%;
        height: 4px;
        background: #e5e7eb;
        margin: 2rem auto;
      }

      /* Projects */
      #projects {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #projects h2 {
        font-size: 2.25rem;
        font-weight: 800;
        margin-top: 4rem;
        margin-bottom: 2rem;
      }

      @media (min-width: 640px) {
        #projects h2 {
          font-size: 3rem;
        }
      }

      #projects-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
        max-width: 1024px;
        width: 100%;
        padding: 1rem;
        margin-top: 1.75rem;
      }

      @media (min-width: 768px) {
        #projects-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .project-card {
        display: block;
        text-decoration: none;
        border-radius: 0.5rem;
        overflow: hidden;
        background: #1f2937;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        transition: transform 0.3s;
        height: 100%;
      }

      .project-card:hover {
        transform: scale(1.02);
      }

      .project-card-img-wrap {
        overflow: hidden;
      }

      .project-card img {
        width: 100%;
        height: 16rem;
        object-fit: cover;
        display: block;
        transition: transform 0.5s;
      }

      .project-card:hover img {
        transform: scale(1.1);
      }

      .project-card-body {
        padding: 1rem;
        text-align: center;
      }

      .project-card-body h3 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #d1d5db;
        margin-bottom: 0.5rem;
      }

      .project-card-body p {
        color: #d1d5db;
      }

      /* Contact */
      #contact {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        margin-top: 4rem;
      }

      #contact h2 {
        font-size: 2.25rem;
        font-weight: 800;
        margin-bottom: 2rem;
      }

      @media (min-width: 640px) {
        #contact h2 {
          font-size: 3rem;
        }
      }

      #contact svg {
        width: 1.75rem;
        height: 1.75rem;
        color: #fff;
        fill: currentColor;
      }

      #contact a {
        color: #fff;
        text-decoration: none;
        font-size: 1.125rem;
        margin-bottom: 2rem;
      }

      #contact a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- Stars background -->
    <div id="stars-container"></div>

    <!-- Main content -->
    <div id="content">

      <!-- Hero -->
      <div id="hero">
        <img id="hero-img" src="/hero.png" alt="Dan Myers" />
        <p id="hero-name">Dan Myers</p>
        <p id="hero-title">Software Engineer</p>
      </div>

      <!-- Social Icons -->
      <div id="social">
        <a href="https://www.linkedin.com/in/danpmyers/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <!-- LinkedIn icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </a>
        <a href="https://git.danmyers.net" target="_blank" rel="noopener noreferrer" aria-label="Gitea">
          <!-- GitHub/Gitea icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
        </a>
      </div>

      <div class="divider"></div>

      <!-- Projects -->
      <section id="projects">
        <h2>Projects</h2>
        <div id="projects-grid">

          <a class="project-card" href="https://life.danmyers.net" target="_blank" rel="noopener noreferrer">
            <div class="project-card-img-wrap">
              <img src="/life.webp" alt="Conway's Game of Life" />
            </div>
            <div class="project-card-body">
              <h3>Conway's Game of Life</h3>
              <p>Conway's Game of Life in Rust running in WebAssembly</p>
            </div>
          </a>

          <a class="project-card" href="https://rain.danmyers.net" target="_blank" rel="noopener noreferrer">
            <div class="project-card-img-wrap">
              <img src="/rain.webp" alt="Rain Mixer" />
            </div>
            <div class="project-card-body">
              <h3>Rain Mixer</h3>
              <p>Audio mixer website and desktop app for relaxing sounds</p>
            </div>
          </a>

          <a class="project-card" href="https://gif.danmyers.net" target="_blank" rel="noopener noreferrer">
            <div class="project-card-img-wrap">
              <img src="/gif.webp" alt="Gif Maker" />
            </div>
            <div class="project-card-body">
              <h3>Gif Maker</h3>
              <p>Gif maker using ffmpeg</p>
            </div>
          </a>

          <a class="project-card" href="https://tiktactoe.danmyers.net" target="_blank" rel="noopener noreferrer">
            <div class="project-card-img-wrap">
              <img src="/tiktactoe.webp" alt="TikTacToe" />
            </div>
            <div class="project-card-body">
              <h3>TikTacToe</h3>
              <p>Simple TikTacToe game</p>
            </div>
          </a>

        </div>
      </section>

      <div class="divider"></div>

      <!-- Contact -->
      <section id="contact">
        <h2>Contact Me</h2>
        <a href="mailto:contact@danmyers.net" aria-label="Email">
          <!-- Email icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </a>
        <a href="mailto:contact@danmyers.net">contact@danmyers.net</a>
      </section>

    </div>

    <script>
      // Generate star background
      const container = document.getElementById('stars-container');
      for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.top = (Math.random() * 100) + '%';
        star.style.left = (Math.random() * 100) + '%';
        container.appendChild(star);
      }
    </script>
  </body>
</html>
